name: Deploy Sync

on:
  push:
    branches:
      - main
    paths:
      - deploy/**
      - export-deploy.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v4

      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PSFree_Docker
          token: ${{ secrets.PSFREE_DOCKER_DEPLOY_PAT }}
          path: deploy-repo

      - name: Export deploy content
        env:
          DEPLOY_REPO: deploy-repo
          DEPLOY_DELETE: "1"
        run: ./export-deploy.sh

      - name: Commit and push deploy repo
        working-directory: deploy-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes to push."
            exit 0
          fi

          git commit -m "Deploy from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
